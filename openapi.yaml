openapi: 3.0.3
info:
  title: Oncepass
  version: 0.1.0
  description: Consent-gated KYC evidence reuse with off-chain personal data and on-chain hashes only.
  x-product-slug: ai-decentralized-oncepass
  x-source: ai-in-decentralized+ai/fiveconsiderationsforblockchainappliedtodataprivacygdpr-180525134814/
servers:
- url: https://api.example.com
tags:
- name: Vaults
  description: Home identity vaults
- name: Evidence
  description: Hash evidence records
- name: Consents
  description: Time-boxed consent grants
- name: Access
  description: Relying-party evidence access
- name: Erasures
  description: Vault delete and hash orphaning
- name: Participants
  description: Network participant orgs
paths:
  /v1/vaults:
    get:
      operationId: listHomeVaults
      tags:
      - Vaults
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeHomeVault'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: registerHomeVault
      tags:
      - Vaults
      security:
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeHomeVault'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeVaultCreate'
  /v1/evidence:
    post:
      operationId: notariseEvidence
      tags:
      - Evidence
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeEvidenceRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRecordCreate'
    get:
      operationId: listEvidence
      tags:
      - Evidence
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeEvidenceRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - name: subjectRef
        in: query
        schema:
          type: string
  /v1/consents:
    get:
      operationId: listConsentGrants
      tags:
      - Consents
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeConsentGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: createConsentGrant
      tags:
      - Consents
      security:
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeConsentGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrantCreate'
  /v1/consents/{grantId}/withdraw:
    post:
      operationId: withdrawConsentGrant
      tags:
      - Consents
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeConsentGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
  /v1/access-requests:
    post:
      operationId: requestEvidenceAccess
      tags:
      - Access
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeAccessRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
    get:
      operationId: listAccessRequests
      tags:
      - Access
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeAccessRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
  /v1/erasures:
    post:
      operationId: executeVaultErasure
      tags:
      - Erasures
      security:
      - BearerAuth: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeErasureEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureEventCreate'
  /v1/participants:
    get:
      operationId: listParticipants
      tags:
      - Participants
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeParticipantOrg'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: registerParticipant
      tags:
      - Participants
      security:
      - BearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeParticipantOrg'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantOrg'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    HomeVault:
      type: object
      required:
      - id
      - institutionId
      properties:
        id:
          type: string
        institutionId:
          type: string
        subjectRef:
          type: string
    HomeVaultCreate:
      type: object
      required:
      - institutionId
      - subjectRef
      properties:
        institutionId:
          type: string
        subjectRef:
          type: string
    EvidenceRecord:
      type: object
      required:
      - id
      - vaultId
      - evidenceHash
      properties:
        id:
          type: string
        vaultId:
          type: string
        evidenceHash:
          type: string
        orphaned:
          type: boolean
    EvidenceRecordCreate:
      type: object
      required:
      - vaultId
      - evidenceHash
      properties:
        vaultId:
          type: string
        evidenceHash:
          type: string
    ConsentGrant:
      type: object
      required:
      - id
      - subjectRef
      - relyingPartyId
      - status
      properties:
        id:
          type: string
        subjectRef:
          type: string
        relyingPartyId:
          type: string
        purpose:
          type: string
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - active
          - withdrawn
          - expired
    ConsentGrantCreate:
      type: object
      required:
      - subjectRef
      - relyingPartyId
      - purpose
      - expiresAt
      properties:
        subjectRef:
          type: string
        relyingPartyId:
          type: string
        purpose:
          type: string
        expiresAt:
          type: string
          format: date-time
    AccessRequest:
      type: object
      required:
      - id
      - grantId
      - status
      properties:
        id:
          type: string
        grantId:
          type: string
        status:
          type: string
          enum:
          - allowed
          - denied
        payloadRef:
          type: string
    AccessRequestCreate:
      type: object
      required:
      - grantId
      properties:
        grantId:
          type: string
    ErasureEvent:
      type: object
      required:
      - id
      - vaultId
      - status
      properties:
        id:
          type: string
        vaultId:
          type: string
        status:
          type: string
          enum:
          - accepted
          - completed
        hashesOrphaned:
          type: integer
    ErasureEventCreate:
      type: object
      required:
      - vaultId
      properties:
        vaultId:
          type: string
    ParticipantOrg:
      type: object
      required:
      - id
      - name
      - role
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - home
          - relying
          - operator
        dpoContact:
          type: string
    DataEnvelopeHomeVault:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/HomeVault'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeHomeVault:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/HomeVault'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeEvidenceRecord:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/EvidenceRecord'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeEvidenceRecord:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EvidenceRecord'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeConsentGrant:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ConsentGrant'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeConsentGrant:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ConsentGrant'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeAccessRequest:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AccessRequest'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeAccessRequest:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AccessRequest'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeErasureEvent:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ErasureEvent'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeErasureEvent:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ErasureEvent'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DataEnvelopeParticipantOrg:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ParticipantOrg'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeParticipantOrg:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ParticipantOrg'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'

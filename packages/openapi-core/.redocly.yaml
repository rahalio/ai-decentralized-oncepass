apis:
  identity:
    root: src/identity.yaml
  vaults:
    root: src/vaults.yaml
  evidence:
    root: src/evidence.yaml
  consents:
    root: src/consents.yaml
  access:
    root: src/access.yaml
  erasures:
    root: src/erasures.yaml
  participants:
    root: src/participants.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []

openapi: 3.1.0
info:
  title: Erasures API
  version: 0.1.0
  description: |
    Vault delete and on-chain hash orphaning without ledger deletion (BR-5).
  license:
    name: Proprietary
    url: https://oncepass.local/license
  x-domain: ers
  x-domain-prefix: ER
  x-product-slug: oncepass
servers:
  - url: https://api.oncepass.local
    description: Local API
security:
  - apiKey: []
tags:
  - name: Erasures
    description: Vault erase and orphan events
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey

paths:
  /v1/erasures:
    get:
      operationId: listErasureEvents
      tags: [Erasures]
      summary: List erasure / orphan events
      x-repository: ErasureEvent
      x-dynamodb:
        entityType: "ERASURE"
        pkPatternTemplate: "ERASURE#${erasureId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: vaultId
          in: query
          schema:
            $ref: ./erasures.schemas.yaml#/components/schemas/VaultId
      responses:
        "200":
          description: Erasure list
          content:
            application/json:
              schema:
                $ref: ./erasures.schemas.yaml#/components/schemas/ErasureListResponse
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: executeVaultErasure
      tags: [Erasures]
      summary: Delete vault PD and orphan evidence hashes
      x-repository: ErasureEvent
      x-dynamodb:
        entityType: "ERASURE"
        pkPatternTemplate: "ERASURE#${erasureId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./erasures.schemas.yaml#/components/schemas/ErasureEventCreate
      responses:
        "202":
          description: Erasure accepted
          content:
            application/json:
              schema:
                $ref: ./erasures.schemas.yaml#/components/schemas/ErasureEventResponse
        "400":
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/erasures/{erasureId}:
    get:
      operationId: getErasureEvent
      tags: [Erasures]
      summary: Get erasure event by id
      x-repository: ErasureEvent
      x-dynamodb:
        entityType: "ERASURE"
        pkPatternTemplate: "ERASURE#${erasureId}"
        skPatternTemplate: "METADATA"
        pkPattern: entity
        usePkQuery: false
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - name: erasureId
          in: path
          required: true
          schema:
            $ref: ./erasures.schemas.yaml#/components/schemas/ErasureId
      responses:
        "200":
          description: Erasure event
          content:
            application/json:
              schema:
                $ref: ./erasures.schemas.yaml#/components/schemas/ErasureEventResponse
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "404":
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
